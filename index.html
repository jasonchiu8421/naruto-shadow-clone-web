<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto Shadow Clone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Naruto Shadow Clone</h1>

      <div style="text-align: center; margin-bottom: 12px;">
        <a href="trainer.html" style="display: inline-block; padding: 10px 20px; background: #f97316; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 16px;">
          Train Your Own Model
        </a>
        <button id="btn-reset-clones" type="button" style="display: inline-block; margin-left: 8px; padding: 10px 16px; background: #374151; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer;">
          Reset Effect
        </button>
      </div>

      <div style="text-align: center; margin-bottom: 12px;">
        <div style="font-size: 13px; color: #9ca3af; margin-bottom: 6px;">
          Model loads automatically from this browser. Optional backup upload:
        </div>
        <input type="file" id="model-upload" accept=".json" style="margin-bottom: 5px; display: inline-block; font-size: 14px;">
        <button onclick="loadCustomModel()" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">Upload Backup Model</button>
        <div id="upload-status" style="font-size: 13px; margin-top: 5px; color: #666;"></div>
      </div>

      <div id="confidence-container" class="confidence-container">
        <div class="confidence-text">Confidence:</div>
        <div class="confidence">0%</div>
      </div>

      <div id="error" class="error hidden"></div>

      <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <button class="video-overlay-btn">
          <img id="overlayImg" src="assets/state-1.png" data-state="1" alt="overlay button" />
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
